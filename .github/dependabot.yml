version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      docker-actions:
        patterns:
          - 'docker/*'
          - 'actions/*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/web
      - /apps/admin
    schedule:
      interval: weekly
    groups:
      docker-base-images:
        patterns:
          - 'node'
          - 'nginx'
    ignore:
      # Pin Node to its current LTS major. Crossing a major (e.g. 24 -> 26 LTS,
      # or jumping to a non-LTS odd release) needs manual review for native
      # module ABI changes, so block automated major bumps entirely.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
